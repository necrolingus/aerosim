<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AeroSim — Client-Side WebGPU Wind Tunnel</title>
    <!-- Distinctive Typography: Space Grotesk (Display) + Plus Jakarta Sans (UI) + IBM Plex Mono (Telemetry) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      // Friendly protocol check: Detect if opened directly via file:///
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', () => {
          const banner = document.createElement('div');
          banner.id = 'file-protocol-warning';
          banner.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(11,16,27,0.96);z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px;text-align:center;';
          banner.innerHTML = `
            <div style="background:#1e293b; border:1px solid #f59e0b; border-radius:12px; padding:32px 40px; max-width:620px; box-shadow:0 20px 40px rgba(0,0,0,0.8);">
              <div style="font-size:36px; margin-bottom:12px;">⚠️</div>
              <h2 style="color:#f59e0b; margin:0 0 12px 0; font-size:20px;">Local Web Server Required</h2>
              <p style="color:#94a3b8; font-size:13.5px; line-height:1.6; margin:0 0 20px 0;">
                You opened AeroSim directly using the <code>file:///</code> protocol. Modern web browsers disable <strong>WebGPU</strong> (hardware compute acceleration) and block ES module scripts on <code>file://</code> URLs for security reasons.
              </p>
              <div style="background:#0f172a; border:1px solid #334155; border-radius:8px; padding:16px 20px; text-align:left; font-family:Consolas,monospace; font-size:13px; margin-bottom:20px;">
                <div style="color:#38bdf8; margin-bottom:8px;"># Open terminal in project folder and run:</div>
                <div style="color:#4ade80; margin-bottom:6px;"><strong>npm run dev</strong> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span style="color:#64748b;"># Live development server</span></div>
                <div style="color:#64748b; font-size:11.5px; margin-bottom:10px;">➜ Open: <a href="http://localhost:5173/" style="color:#38bdf8; text-decoration:none;">http://localhost:5173/</a></div>
                <div style="color:#4ade80; margin-bottom:6px;"><strong>npm run preview</strong> &nbsp;&nbsp;<span style="color:#64748b;"># Production build preview</span></div>
                <div style="color:#64748b; font-size:11.5px;">➜ Open: <a href="http://localhost:4173/" style="color:#38bdf8; text-decoration:none;">http://localhost:4173/</a></div>
              </div>
              <p style="color:#64748b; font-size:12px; margin:0;">
                Once the server starts, open the <code>http://localhost:...</code> URL in your browser.
              </p>
            </div>
          `;
          document.body.prepend(banner);
        });
      }
    </script>
  </head>
  <body>
    <div id="app-layout">
      <aside id="sidebar">
        <div class="brand-header">
          <div class="brand-title">
            <span class="brand-indicator"></span>
            <span class="brand-text">AEROSIM</span>
            <span class="brand-sub">WIND TUNNEL</span>
          </div>
          <span class="phase-pill">SYSTEM V6.0 · ACTIVE</span>
        </div>
        <div id="preset-selector-mount"></div>
        <div id="control-panel-mount"></div>
      </aside>

      <main id="stage-wrapper">
        <a href="https://github.com/necrolingus/aerosim" target="_blank" rel="noopener noreferrer" id="github-link-btn" title="View AeroSim source on GitHub">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
          </svg>
          <span>GitHub</span>
        </a>
        <div id="telemetry-hud"></div>
        <div id="viewport-canvas-container"></div>
        <div id="convergence-chart-mount"></div>
        <div id="viewport-footer-hint">
          <span><i class="legend-dot dot-blue"></i>Low / Recirculation</span>
          <span><i class="legend-dot dot-green"></i>Freestream / Neutral</span>
          <span><i class="legend-dot dot-amber"></i>Shear / Accelerated</span>
          <span><i class="legend-dot dot-red"></i>Vortex Core / Stagnation</span>
          <span>Shortcuts: <strong>W</strong> Move · <strong>E</strong> Rotate · <strong>R</strong> Scale</span>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
